<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Example EHR — embedding Tandem</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: #1c1917;
        background: #f5f5f4;
      }
      header {
        background: #292524;
        color: #fafaf9;
        padding: 12px 24px;
        font-weight: 600;
      }
      header span {
        color: #a8a29e;
        font-weight: 400;
        font-size: 13px;
        margin-left: 10px;
      }
      main {
        display: grid;
        grid-template-columns: 1fr 340px;
        gap: 16px;
        padding: 16px 24px;
      }
      iframe {
        width: 100%;
        height: 420px;
        border: 1px solid #d6d3d1;
        border-radius: 8px;
        background: #fff;
      }
      aside {
        background: #fff;
        border: 1px solid #e7e5e4;
        border-radius: 8px;
        padding: 12px 14px;
      }
      aside h2 {
        font-size: 13px;
        text-transform: uppercase;
        letter-spacing: 0.04em;
        color: #78716c;
        margin: 0 0 8px;
      }
      #log {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 12px;
        white-space: pre-wrap;
        word-break: break-word;
        color: #44403c;
        max-height: 380px;
        overflow: auto;
      }
      #log .t {
        color: #a8a29e;
      }
    </style>
  </head>
  <body>
    <header>Example EHR <span>reference implementation of the partner side of Tandem's iframe SSO</span></header>
    <main>
      <iframe id="tandem-iframe" allow="microphone; clipboard-read; clipboard-write *" title="Tandem"></iframe>
      <aside>
        <h2>What this page did</h2>
        <div id="log"></div>
      </aside>
    </main>
    <script src="/partner.js"></script>
  </body>
</html>
