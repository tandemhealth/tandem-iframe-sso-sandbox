<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Tandem (sandbox)</title>
    <style>
      :root {
        color-scheme: light;
      }
      body {
        margin: 0;
        font:
          15px/1.5 -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          Roboto,
          sans-serif;
        color: #1c1917;
        background: #fff;
      }
      main {
        padding: 20px 24px;
        max-width: 720px;
      }
      h1 {
        font-size: 18px;
        margin: 0 0 4px;
      }
      .sub {
        color: #78716c;
        font-size: 13px;
        margin: 0 0 16px;
      }
      #status {
        padding: 12px 14px;
        border-radius: 8px;
        background: #f5f5f4;
        border: 1px solid #e7e5e4;
      }
      #status.ok {
        background: #f0fdf4;
        border-color: #bbf7d0;
      }
      #status.bad {
        background: #fef2f2;
        border-color: #fecaca;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        background: #f5f5f4;
        padding: 1px 5px;
        border-radius: 4px;
      }
      #status.ok code,
      #status.bad code {
        background: rgba(255, 255, 255, 0.7);
      }
      .hint {
        color: #57534e;
        font-size: 13px;
        margin-top: 14px;
      }
      a {
        color: #0f766e;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Tandem <span class="sub">iframe SSO sandbox — stands in for app.tandemhealth.ai</span></h1>
      <div id="status">Loading…</div>
      <p class="hint" id="hint"></p>
    </main>
    <script src="/tandem.js"></script>
  </body>
</html>
